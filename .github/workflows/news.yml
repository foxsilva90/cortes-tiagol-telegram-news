name: Noticias de futebol no Telegram

on:
  schedule:
    # Minutos "quebrados": o GitHub atrasa/pula mais os agendamentos em :00/:15/:30/:45.
    # Disparo principal vem de fora (cron-job.org -> workflow_dispatch); este é o reserva.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Postar novidades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/telegram_news.py

      - name: Salvar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/telegram_news_state.json
          git diff --cached --quiet || (git commit -m "chore: atualiza noticias postadas" && git push)
